<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>MobiFlix Player</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    #player-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      color: #e50914;
      font-size: 42px;
      transition: opacity 0.4s;
    }
    .loading-overlay.hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>

  <div class="loading-overlay" id="loading-overlay">
    <i class="fa fa-spinner fa-spin"></i>
  </div>

  <iframe
    id="player-frame"
    src=""
    allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
    allowfullscreen
    referrerpolicy="no-referrer"
  ></iframe>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const type = params.get('type') || 'movie';
      const id = params.get('id') || '';
      const season = params.get('season') || '';
      const episode = params.get('episode') || '';

      // ============================================================
      // ✅ PLAYER URLS
      // ============================================================
      const MOVIE_BASE = 'https://vidstuck.xyz/embed/movie/';
      const TV_BASE = 'https://vidstuck.xyz/embed/tv/';

      let embedURL = '';

      if (type === 'tv') {
        if (season && episode) {
          embedURL = `${TV_BASE}${id}/${season}/${episode}`;
        } else {
          embedURL = `${TV_BASE}${id}`;
        }
      } else {
        embedURL = `${MOVIE_BASE}${id}`;
      }

      // ============================================================
      // ✅ SUBTITLE + AUTOPLAY PARAMETERS
      // Sinusubukan lahat ng posibleng param names para tumaas
      // ang chance na may suportahan ang embed player.
      // ============================================================
      const subtitleParams = [
        'autoplay=1',
        'autoPlay=1',
        'muted=0',
        'playsinline=1',
        'subtitle=en',        // common
        'subtitle=en_US',     // locale variant
        'sub_lang=en',        // fallback
        'sub=en',             // short form
        'lang=en',            // generic
        'cc=1',               // closed captions ON
        'cc_lang=en',         // CC language
        'sub=1',              // subtitles ON
        'caption=en',         // caption lang
        'captions=1',         // captions ON
        'default_subtitle=en' // default subtitle
      ];

      const separator = embedURL.includes('?') ? '&' : '?';
      embedURL = embedURL + separator + subtitleParams.join('&');

      const frame = document.getElementById('player-frame');
      frame.src = embedURL;

      // ============================================================
      // ✅ POSTMESSAGE COMMANDS
      // Ipinapadala sa iframe para subukang i-enable ang subtitles
      // sa loob ng player (kung sinusuportahan nito).
      // ============================================================
      function sendSubtitleCommands() {
        try {
          const commands = [
            // Generic subtitle commands
            { type: 'setSubtitle', lang: 'en', enabled: true },
            { type: 'subtitle', enabled: true, lang: 'en' },
            { type: 'enableSubtitle', lang: 'en' },
            { type: 'setSubtitleTrack', lang: 'en' },
            { type: 'subtitleTrack', lang: 'en' },
            { type: 'cc', enabled: true, lang: 'en' },
            { type: 'captions', enabled: true, lang: 'en' },
            // Player-specific
            { event: 'subtitle', action: 'enable', lang: 'en' },
            { event: 'cc', action: 'on', lang: 'en' },
            { action: 'setSubtitle', language: 'en' },
            { action: 'setLanguage', language: 'en' },
            // Play command
            { type: 'play' },
            { event: 'play' },
            { action: 'play' }
          ];

          commands.forEach(function(cmd) {
            try {
              frame.contentWindow.postMessage(cmd, '*');
            } catch (e) {}
          });
        } catch (e) {
          console.warn('[Player] postMessage error:', e);
        }
      }

      // Ipadala pagkatapos mag-load
      frame.addEventListener('load', function() {
        // Hide loading overlay
        setTimeout(function() {
          document.getElementById('loading-overlay').classList.add('hidden');
        }, 600);

        // Send subtitle commands agad
        sendSubtitleCommands();

        // At ulitin pagkatapos ng ilang segundo (kung late mag-init ang player)
        setTimeout(sendSubtitleCommands, 1500);
        setTimeout(sendSubtitleCommands, 3000);
        setTimeout(sendSubtitleCommands, 5000);
      });

      // Fallback: itago ang loading pagkatapos ng 4 seconds
      setTimeout(function() {
        document.getElementById('loading-overlay').classList.add('hidden');
      }, 4000);

      // ============================================================
      // ✅ MESSAGE LISTENER
      // Nakikinig sa response ng iframe para malaman kung
      // nag-enable ba ang subtitles.
      // ============================================================
      window.addEventListener('message', function(event) {
        const data = event.data;
        if (!data) return;
        if (typeof data === 'object') {
          if (data.type === 'subtitle' || data.type === 'cc' || data.subtitle) {
            console.log('[Player] Subtitle response:', data);
          }
          if (data.event === 'ready' || data.type === 'ready') {
            // Kapag ready na ang player, ipadala ulit ang subtitle commands
            sendSubtitleCommands();
          }
        }
      });

      // ============================================================
      // ✅ LANDSCAPE LOCK (mobile)
      // ============================================================
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(function() {});
      }

      // ============================================================
      // ✅ DEBUG: I-log ang final embed URL
      // Para makita mo kung ano ang ipinapasa sa player.
      // ============================================================
      console.log('[MobiFlix Player] Embed URL:', embedURL);
      console.log('[MobiFlix Player] Type:', type, '| ID:', id,
                  season ? '| S' + season + 'E' + episode : '');
    })();
  </script>
</body>
</html>
